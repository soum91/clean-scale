name: CleanScale
options:
  bundleIdPrefix: com.cleanscale
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  CleanScale:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Scale
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: "Connects to your scale over Bluetooth to read your weight."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanscale.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
